name: Build and Deploy ASP.Net Core app to Azure container services - apiprojecttest001

# Automatic deployment is disabled: a push touching src/ProjectAPI/** used to
# build and publish straight to the Azure container registry, so ordinary
# backend commits shipped to a live environment with no review step. The job
# itself is unchanged and can still be started deliberately from the Actions
# tab (workflow_dispatch); re-enable the push/pull_request triggers below when
# automatic delivery is wanted again.
on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - "src/ProjectAPI/**"
  #   branches:
  #     - main
  # pull_request:
  #   paths:
  #     - "src/ProjectAPI/**"
  #   branches:
  #     - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}      # e.g., myregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}        # ACR admin or service principal ID
          password: ${{ secrets.ACR_PASSWORD }}        # Corresponding password

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ProjectAPI/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest
