name: Build and Deploy ASP.Net Core app to Azure container services - apiprojecttest001

# Automatic deployment is disabled — see build_and_deploy_acr.yml, which is a
# byte-for-byte duplicate of this workflow and deploys the same image to the
# same registry. Both are left runnable on demand only.
on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - "src/ProjectAPI/**"
  #   branches:
  #     - main
  # pull_request:
  #   paths:
  #     - "src/ProjectAPI/**"
  #   branches:
  #     - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}      # e.g., myregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}        # ACR admin or service principal ID
          password: ${{ secrets.ACR_PASSWORD }}        # Corresponding password

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ProjectAPI/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest
